[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itmam"
version = "0.1.0"
description = "Itmam: every actionable screening result, owned until care is complete."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[tool.setuptools.package-data]
itmam = ["web/*.html", "web/*.js", "web/*.svg", "web/*.webmanifest"]

[tool.setuptools.packages.find]
include = ["itmam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    # newer Starlette versions warn that httpx-based TestClient support is deprecated
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["itmam"]
known-local-folder = ["support"]

[tool.mypy]
python_version = "3.12"
files = ["itmam", "tests"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
